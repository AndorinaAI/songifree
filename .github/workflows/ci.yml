name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Check package.json presence
        id: check_pkg
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check_pkg.outputs.has_package == 'true'
        run: npm install

      - name: Typecheck / Lint (if configured)
        if: steps.check_pkg.outputs.has_package == 'true'
        run: npm run lint --if-present

      - name: Run Tests (if configured)
        if: steps.check_pkg.outputs.has_package == 'true'
        run: npm test --if-present

      - name: Build (if configured)
        if: steps.check_pkg.outputs.has_package == 'true'
        run: npm run build --if-present
