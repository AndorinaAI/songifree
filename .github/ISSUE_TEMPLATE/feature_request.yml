name: "✨ Feature Request"
description: "Suggest a new idea or improvement for Songifree"
title: "[Feature]: "
labels: ["enhancement", "feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Songifree better for streamers, moderators, or viewers? Share it here!
  - type: dropdown
    id: category
    attributes:
      label: "Feature Category"
      description: "Which part of Songifree does this feature relate to?"
      options:
        - "Spotify Playback & Integration"
        - "Chat Command & Permissions System"
        - "Streaming Platform Integration (Twitch/Kick/TikTok)"
        - "OBS Overlay & Visual Themes"
        - "Moderation, Cooldowns & Blacklist"
        - "Broadcaster Web Dashboard"
        - "Developer API & Extensibility"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Opportunity"
      description: "Is your feature request related to a problem or limitation? A clear and concise description of what the limitation is."
      placeholder: "e.g., Streamers currently have to manually skip songs when troll requests get through..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "A clear and concise description of what you want to happen."
      placeholder: "e.g., Introduce an AI or keyword sentiment filter, or add a quick-ban button in the OBS dock..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "A description of any alternative solutions or workarounds you have considered."
  - type: checkboxes
    id: contribution
    attributes:
      label: "Willingness to Contribute"
      options:
        - label: "I would be interested in submitting a Pull Request for this feature!"
          required: false
